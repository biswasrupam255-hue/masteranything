# .github/workflows/ci.yml
# Lesson 02 — same checks, but parallel, cheaper and tested on more than one Node.

name: CI

on:
  push:
    branches: [main]
    # Editing docs should not burn CI minutes.
    paths-ignore: ["**.md", "lessons/**"]
  pull_request:

# Push twice in a minute and the first run is pointless. Cancel it.
# Group per branch/PR so other people's runs are untouched.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. This workflow only reads code; say so explicitly.
# Without this, the token gets whatever the repo default is.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- quality
  # Fast static checks. Fails in ~20s, before the slower jobs matter.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # a hung job dies instead of burning 6 hours
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ------------------------------------------------------------------- test
  # One VM per Node version, all at the same time.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Default is true: one red cell kills the others instantly.
      # We want the full picture - "broken on 22, fine on 24" is the useful answer.
      fail-fast: false
      matrix:
        node: ["22", "24"]
    # Name the cell so the UI reads "test (22)" not "test (1)".
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # ------------------------------------------------------------------ build
  # Only worth doing if everything above is green. `needs` makes the edge.
  build:
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  # ------------------------------------------------------------------ ci-ok
  # The ONLY check we require in branch protection.
  #
  # Why: required checks are matched by name. Require "test (node 22)" directly
  # and the day you bump the matrix to 24/26, protection waits forever for a
  # check that will never report again. This name never changes.
  #
  # if: always() is load-bearing. Without it, a failed upstream job makes this
  # job *skipped*, a skipped required check never reports, and your PR hangs
  # on a pending gate instead of showing a clean red X.
  ci-ok:
    if: always()
    needs: [quality, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "upstream results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "all required jobs passed"
