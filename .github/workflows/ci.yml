# .github/workflows/ci.yml
# Lesson 04 — build once, keep the output, report what happened.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "lessons/**"]
  # NOTE: deliberately no paths-ignore here. Once "ci-ok" is a required check,
  # a PR that triggers no run can never satisfy it and hangs forever.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- quality
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ------------------------------------------------------------------- test
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # Every cell proves the tests pass...
      - name: Test
        if: matrix.node != '24'
        run: npm test

      # ...but only ONE cell produces coverage. Two cells uploading an artifact
      # of the same name is an error (artifact names must be unique per run).
      # If you do want one per cell: name: coverage-node-${{ matrix.node }}
      - name: Test with coverage
        if: matrix.node == '24'
        run: npm run test:coverage

      - name: Write coverage to the job summary
        if: matrix.node == '24'
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the clickable HTML coverage report
        if: matrix.node == '24'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage/
          retention-days: 7
          if-no-files-found: error   # silence here would mean a broken report

  # ------------------------------------------------------------------ build
  build:
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # THE point of this lesson: the compiled output survives the VM.
      - name: Upload dist/
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------ smoke
  # Runs the ARTEFACT, not the source. This is the first job that tests the
  # thing you would actually deploy.
  smoke:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # --omit=dev: production deps only, exactly like a real server.
      # If a runtime import accidentally lives in devDependencies, this fails
      # here instead of in production at 3am.
      - run: npm ci --omit=dev

      - name: Download dist/ from the build job
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Boot it and probe /health
        run: |
          node dist/server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health -o health.json; then break; fi
            sleep 0.5
          done
          echo "response: $(cat health.json)"
          test "$(jq -r .status < health.json)" = "ok"
          kill "$SERVER_PID"

      - name: Report it
        run: |
          {
            echo "### Smoke test"
            echo ""
            echo '```json'
            cat health.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ ci-ok
  # Still the only required check. We just added a whole new job above and
  # branch protection needed zero changes. That is why this job exists.
  ci-ok:
    if: always()
    needs: [quality, test, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "upstream results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - run: echo "all required jobs passed"

  # -------------------------------------------------------- deploy-staging
  # Only on main, only on a real push. A pull_request run must NEVER reach
  # deployment secrets - see lesson 05 on forks.
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-ok]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Naming an environment is what unlocks that environment's secrets and
    # variables, and what makes GitHub record a deployment.
    environment:
      name: staging
      url: ${{ vars.TARGET_URL }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy
        env:
          # Map secrets into env vars. Do NOT interpolate ${{ secrets.X }}
          # directly inside a run: script - that pastes the value into the
          # shell command line, where it can land in error messages and
          # process listings.
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "deploying ${GITHUB_SHA::7} to ${{ vars.TARGET_URL }}"
          echo "artifact contents:"
          ls -1 dist
          # Check a secret exists WITHOUT printing it.
          echo "token length: ${#DEPLOY_TOKEN}"
          test -n "$DEPLOY_TOKEN"

      - name: What masking does, and does not, protect you from
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "1. printed straight : $DEPLOY_TOKEN"
          echo "2. base64 encoded   : $(printf %s "$DEPLOY_TOKEN" | base64)"
          echo "3. reversed         : $(printf %s "$DEPLOY_TOKEN" | rev)"
          echo "Only #1 is masked. Masking is string matching, not security."

      - name: Record it
        run: |
          {
            echo "### Deployed to staging"
            echo ""
            echo "- commit: \`${GITHUB_SHA::7}\`"
            echo "- url: ${{ vars.TARGET_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------- deploy-production
  # Identical mechanics, one difference: this environment has a required
  # reviewer, so the job PAUSES here until a human clicks Approve.
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.TARGET_URL }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "deploying ${GITHUB_SHA::7} to ${{ vars.TARGET_URL }}"
          # Same name, DIFFERENT value: this is the production environment's
          # secret, which the staging job could not read.
          echo "token length: ${#DEPLOY_TOKEN}"
          test -n "$DEPLOY_TOKEN"

      - name: Record it
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "- commit: \`${GITHUB_SHA::7}\`"
            echo "- approved by: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
