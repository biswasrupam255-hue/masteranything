# .github/workflows/release.yml
# Cutting a version: git tag -> semver-tagged image + a GitHub release.
#
# Why a separate workflow: it answers a different question. ci.yml asks
# "is main healthy?" on every commit. This asks "what are we calling v1.2.0?"
# and runs a handful of times a year.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write    # create the GitHub release
      packages: write    # push the image
    steps:
      - uses: actions/checkout@v7
        with:
          # Release notes are generated from commit history, so we need all
          # of it. The default shallow clone has one commit.
          fetch-depth: 0

      # Never publish a version you have not tested, however green main was.
      - uses: ./.github/actions/node-setup
      - run: npm test

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 produces 1.2.3, 1.2 and 1 - so consumers can pin as
          # loosely or as tightly as they want.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Notes are written to a file rather than passed as a multi-line
          # string. The first version of this step had its second line at
          # column 0 inside this block, which ended the YAML block scalar and
          # turned the rest into a stray top-level key: valid YAML, invalid
          # workflow, 0-second startup failure on every single push.
          {
            echo "Image: ${IMAGE}"
            echo "Digest: ${DIGEST}"
          } > release-notes.md
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes-file release-notes.md
